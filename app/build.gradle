plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.shipcalculation'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.shipcalculation"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room için schema konumu
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        buildFeatures {
            buildConfig true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android temel UI bileşenleri
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.10.1'

    // GPS / Konum servisleri
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // PDF çıktıları için iText
    implementation 'com.itextpdf:kernel:9.2.0'
    implementation 'com.itextpdf:io:9.2.0'
    implementation 'com.itextpdf:layout:9.2.0'
    implementation libs.impress
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    // Room veritabanı
    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"

    // Speed Dial örneği (varsa kullanıyorsan)
    implementation 'com.leinardi.android:speed-dial:3.3.0'

    // Media3 örneği (kullanıyorsan)
    implementation 'androidx.media3:media3-common:1.7.1'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
